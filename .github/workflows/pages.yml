name: Build and deploy PersonaQuest GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Pages setup before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > /tmp/personaquest-pages-type 2>/tmp/personaquest-pages-error; then
            echo "::error title=GitHub Pages setup required::Open Settings > Pages > Build and deployment, choose GitHub Actions, and rerun this workflow. Do not add secrets or change repository visibility."
            cat /tmp/personaquest-pages-error
            exit 1
          fi
          echo "GitHub Pages is configured, type: $(cat /tmp/personaquest-pages-type)"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source and tests
        run: npm run lint && npm test && npm run check:data
      - name: Build static Pages assets
        run: npm run build && npm run verify:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published HTML, JS, CSS and images
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/smoke-pages.mjs "$PAGES_URL"
