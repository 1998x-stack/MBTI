<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonaQuest - 人格探索之旅</title>
    <style>
        /* Apple Design System Colors */
        :root {
            --primary-blue: #007AFF;
            --primary-green: #34C759;
            --primary-orange: #FF9500;
            --primary-red: #FF3B30;
            --primary-purple: #AF52DE;
            --primary-pink: #FF2D92;
            --primary-teal: #5AC8FA;
            --primary-indigo: #5856D6;
            
            --background-primary: #FFFFFF;
            --background-secondary: #F2F2F7;
            --background-tertiary: #FFFFFF;
            --background-grouped: #F2F2F7;
            
            --text-primary: #000000;
            --text-secondary: #3C3C43;
            --text-tertiary: #3C3C4399;
            --text-quaternary: #3C3C4366;
            
            --separator-opaque: #C6C6C8;
            --separator-non-opaque: #3C3C4349;
            
            --sf-pro-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --sf-pro-rounded: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sf-pro-display);
            background: var(--background-secondary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Main Container */
        .app-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card Container */
        .main-card {
            background: var(--background-primary);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            min-height: 600px;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            font-family: var(--sf-pro-rounded);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Navigation */
        .nav-pills {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            background: var(--background-secondary);
        }

        .nav-pill {
            padding: 12px 24px;
            border-radius: 25px;
            background: transparent;
            border: none;
            font-family: var(--sf-pro-display);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .nav-pill.active {
            background: var(--primary-blue);
            color: white;
            transform: scale(1.05);
        }

        .nav-pill:hover {
            background: var(--primary-blue);
            color: white;
            transform: translateY(-2px);
        }

        /* Content Areas */
        .content {
            padding: 30px;
            min-height: 400px;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .content-section.active {
            display: block;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
        }

        .start-screen h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .start-screen p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-button {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: var(--sf-pro-display);
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 122, 255, 0.4);
        }

        /* Question Screen */
        .question-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--separator-opaque);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple));
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--background-tertiary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .scenario-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.6;
            padding: 20px;
            background: var(--background-secondary);
            border-radius: 12px;
            border-left: 4px solid var(--primary-blue);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-button {
            background: var(--background-tertiary);
            border: 2px solid var(--separator-opaque);
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: var(--sf-pro-display);
            font-size: 1rem;
            color: var(--text-primary);
        }

        .option-button:hover {
            border-color: var(--primary-blue);
            background: rgba(0, 122, 255, 0.05);
            transform: translateX(5px);
        }

        .option-button.selected {
            border-color: var(--primary-blue);
            background: var(--primary-blue);
            color: white;
        }

        /* Result Screen */
        .result-container {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            font-weight: bold;
        }

        .result-type {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.5rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .result-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .traits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .trait-card {
            background: var(--background-secondary);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .trait-score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 5px;
        }

        .trait-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Share Button */
        .share-button {
            background: var(--primary-green);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .share-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 199, 89, 0.3);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-card {
                margin: 10px;
                border-radius: 16px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .nav-pills {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .nav-pill {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
            
            .traits-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                    </div>
                </div>
                
                <!-- Test Screen -->
                <div class="content-section" id="test">
                    <div class="question-container">

                        <div class="traits-grid" id="traitsGrid">

                            </div>

                            </div>

                                <div class="trait-label">判断偏好</div>
                            </div>
                        </div>
                        <button class="share-button" onclick="shareResult()">分享结果</button>
                        <button class="share-button" onclick="restartTest()" style="background: var(--primary-orange);">重新测试</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

// Navigation Functions
function switchSection(sectionName) {
    // Hide all sections
    document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
    });
    
    // Remove active state from all nav pills
    document.querySelectorAll('.nav-pill').forEach(pill => {
        pill.classList.remove('active');
    });
    
    // Show target section
    document.getElementById(sectionName).classList.add('active');
    
    // Add active state to clicked nav pill
    document.querySelector(`[data-section="${sectionName}"]`).classList.add('active');
    
    gameState.currentSection = sectionName;
}

// Add event listeners for navigation
document.querySelectorAll('.nav-pill').forEach(pill => {
    pill.addEventListener('click', (e) => {
        const section = e.target.getAttribute('data-section');
        switchSection(section);
    });
});

// Test Functions
function startTest() {
    currentQuestion = 0;
    answers = [];
    gameState.scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    switchSection('test');
    showQuestion();
}

function showQuestion() {
    if (currentQuestion >= questions.length) {
        calculateResult();
        return;
    }

    const question = questions[currentQuestion];
    const progress = ((currentQuestion + 1) / questions.length) * 100;
    
    // Update progress bar
    document.getElementById('progressFill').style.width = progress + '%';
    
    // Update question content
    document.getElementById('questionText').textContent = question.text;
    
    // Show scenario if exists
    const scenarioElement = document.getElementById('scenarioText');
    if (question.scenario) {
        scenarioElement.textContent = question.scenario;
        scenarioElement.style.display = 'block';
    } else {
        scenarioElement.style.display = 'none';
    }
    
    // Create option buttons
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    question.options.forEach((option, index) => {
        const button = document.createElement('button');
        button.className = 'option-button';
        button.textContent = option.text;
        button.onclick = () => selectOption(option, button);
        optionsContainer.appendChild(button);
    });
}

function selectOption(option, buttonElement) {
    // Remove selection from other buttons
    document.querySelectorAll('.option-button').forEach(btn => {
        btn.classList.remove('selected');
    });
    
    // Mark this button as selected
    buttonElement.classList.add('selected');
    
    // Record the answer
    answers[currentQuestion] = option;
    gameState.scores[option.type] += option.value;
    
    // Move to next question after a short delay
    setTimeout(() => {
        currentQuestion++;
        showQuestion();
    }, 500);
}

function calculateResult() {
    const type = 
        (gameState.scores.E > gameState.scores.I ? 'E' : 'I') +
        (gameState.scores.S > gameState.scores.N ? 'S' : 'N') +
        (gameState.scores.T > gameState.scores.F ? 'T' : 'F') +
        (gameState.scores.J > gameState.scores.P ? 'J' : 'P');
    
    displayResult(type);
}

function displayResult(type) {
    const personality = personalities[type];
    
    // Update result display
    document.getElementById('resultAvatar').textContent = personality.emoji;
    document.getElementById('resultType').textContent = type;
    document.getElementById('resultTitle').textContent = personality.title;
    document.getElementById('resultDescription').textContent = personality.description;
    
    // Update scores
    const totalE = gameState.scores.E + gameState.scores.I;
    const totalS = gameState.scores.S + gameState.scores.N;
    const totalT = gameState.scores.T + gameState.scores.F;
    const totalJ = gameState.scores.J + gameState.scores.P;
    
    document.getElementById('score-E').textContent = Math.round((gameState.scores.E / totalE) * 100) + '%';
    document.getElementById('score-S').textContent = Math.round((gameState.scores.S / totalS) * 100) + '%';
    document.getElementById('score-T').textContent = Math.round((gameState.scores.T / totalT) * 100) + '%';
    document.getElementById('score-J').textContent = Math.round((gameState.scores.J / totalJ) * 100) + '%';
    
    // Update color theme
    document.documentElement.style.setProperty('--result-color', personality.color);
    
    switchSection('result');
}

function shareResult() {
    const type = document.getElementById('resultType').textContent;
    const title = document.getElementById('resultTitle').textContent;
    
    if (navigator.share) {
        navigator.share({
            title: 'PersonaQuest - 我的人格类型',
            text: `我是 ${type} - ${title}！快来测试你的人格类型吧！`,
            url: window.location.href
        });
    } else {
        // Fallback: copy to clipboard
        const text = `我在PersonaQuest测试中是 ${type} - ${title}！快来测试你的人格类型吧！ ${window.location.href}`;
        navigator.clipboard.writeText(text).then(() => {
            alert('结果已复制到剪贴板！');
        });
    }
}

function restartTest() {
    currentQuestion = 0;
    answers = [];
    gameState.scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
    switchSection('start');
}

// Add some interactive animations
document.addEventListener('DOMContentLoaded', function() {
    // Add floating animation to header
    const header = document.querySelector('.header');
    if (header) {
        header.style.animation = 'float 6s ease-in-out infinite';
    }
    
    // Add hover effects to cards
    document.querySelectorAll('.option-button').forEach(button => {
        button.addEventListener('mouseenter', function() {
            this.style.transform = 'translateX(5px) scale(1.02)';
        });
        
        button.addEventListener('mouseleave', function() {
            if (!this.classList.contains('selected')) {
                this.style.transform = 'translateX(0) scale(1)';
            }
        });
    });
});

// Add particles effect (optional)
function createParticle() {
    const particle = document.createElement('div');
    particle.style.position = 'fixed';
    particle.style.width = '6px';
    particle.style.height = '6px';
    particle.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 70%)`;
    particle.style.borderRadius = '50%';
    particle.style.pointerEvents = 'none';
    particle.style.left = Math.random() * window.innerWidth + 'px';
    particle.style.top = '-10px';
    particle.style.zIndex = '1000';
    particle.style.opacity = '0.7';
    
    document.body.appendChild(particle);
    
    const animation = particle.animate([
        { transform: 'translateY(0px) rotate(0deg)', opacity: 0.7 },
        { transform: `translateY(${window.innerHeight + 10}px) rotate(360deg)`, opacity: 0 }
    ], {
        duration: Math.random() * 3000 + 2000,
        easing: 'linear'
    });
    
    animation.onfinish = () => particle.remove();
}

// Create particles occasionally
setInterval(createParticle, 3000);

// Add smooth scrolling and page transitions
document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', function(e) {
        // Add ripple effect
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');
        
        this.appendChild(ripple);
        
        setTimeout(() => ripple.remove(), 600);
    });
});
